name: Mondoo SkillCheck

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DISABLE_TELEMETRY: "1"

jobs:
  skillcheck:
    name: Scan for malicious skill content
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install skill into workspace
        run: npx skills add . --skill pair-programming --agent claude-code --yes

      - name: Run Mondoo SkillCheck
        run: npx @mondoohq/skillcheck --no-color --project .
